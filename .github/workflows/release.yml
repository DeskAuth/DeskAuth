name: Release

# Runs when a release is published on GitHub. The release's tag gives the version (v4.1.0 or 4.1.0),
# which is built into the exe. The workflow tests, builds the downloads described on
# deskauth.com/download.html, and attaches them and a SHA256SUMS.txt file to the release. Then the
# website is updated to show the latest published release (pre-releases are never shown).
#
# To rebuild an existing release, run this workflow by hand from the Actions tab and enter its tag.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of the existing release to build and upload to, for example v4.1.0
        required: true

permissions:
  contents: write
  # SignPath reads the build's details and the unsigned files from GitHub
  actions: read

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}

jobs:
  release:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ env.TAG }}

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Get version from tag
        id: version
        shell: pwsh
        run: |
          $version = $env:TAG -replace '^[vV]', ''
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
            throw "The tag '$env:TAG' is not a version such as v4.1.0 or v4.1.0-beta.1"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Test
        run: dotnet test -c Release

      - name: Publish
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force release | Out-Null

          $builds = @(
            @{ Rid = 'win-x64';   SelfContained = 'false'; Name = "DeskAuth-$env:VERSION-x64.exe" },
            @{ Rid = 'win-arm64'; SelfContained = 'false'; Name = "DeskAuth-$env:VERSION-arm64.exe" },
            @{ Rid = 'win-x86';   SelfContained = 'false'; Name = "DeskAuth-$env:VERSION-x86.exe" },
            @{ Rid = 'win-x64';   SelfContained = 'true';  Name = "DeskAuth-$env:VERSION-x64-standalone.exe" }
          )

          foreach ($build in $builds) {
            $out = "publish/" + [IO.Path]::GetFileNameWithoutExtension($build.Name)
            dotnet publish src/DeskAuth -c Release -r $build.Rid `
              --self-contained $build.SelfContained `
              -p:PublishSingleFile=true `
              -p:IncludeNativeLibrariesForSelfExtract=true `
              -p:EnableCompressionInSingleFile=$($build.SelfContained) `
              -p:DebugType=none `
              -p:Version=$env:VERSION `
              -o $out
            if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed for $($build.Name)" }

            $files = Get-ChildItem $out -File
            if ($files.Count -ne 1 -or $files[0].Name -ne 'DeskAuth.exe') {
              throw "Expected only DeskAuth.exe in $out, found: $($files.Name -join ', ')"
            }
            Copy-Item $files[0].FullName "release/$($build.Name)"
          }

      # Signing with SignPath (see code-signing.html). Off until the repository variable
      # SIGNPATH_ORGANIZATION_ID is set; see COMPILING.md for the setup.
      - name: Upload the unsigned files for signing
        id: unsigned
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v4
        with:
          name: unsigned
          path: release/*.exe
          if-no-files-found: error

      - name: Sign with SignPath
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          parameters: |
            version: "${{ steps.version.outputs.version }}"
          # each release waits for an approver in SignPath
          wait-for-completion-timeout-in-seconds: 10800
          output-artifact-directory: signed

      - name: Use the signed files
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: pwsh
        env:
          POLICY: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
        run: |
          $ErrorActionPreference = 'Stop'
          $unsigned = Get-ChildItem release -Filter *.exe -File
          foreach ($file in $unsigned) {
            $signed = Join-Path signed $file.Name
            if (-not (Test-Path $signed)) { throw "SignPath did not return $($file.Name)" }
            $signature = Get-AuthenticodeSignature $signed
            "$($file.Name): $($signature.Status), $($signature.SignerCertificate.Subject)"
            if ($signature.Status -eq 'NotSigned') { throw "$($file.Name) is not signed" }
            # the test-signing policy uses a certificate that Windows doesn't trust
            if ($env:POLICY -ne 'test-signing' -and $signature.Status -ne 'Valid') {
              throw "$($file.Name) does not have a valid signature: $($signature.StatusMessage)"
            }
            Copy-Item $signed $file.FullName -Force
          }

      - name: Checksums
        shell: pwsh
        run: |
          $lines = Get-ChildItem release -Filter *.exe -File | Sort-Object Name | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          }
          # Unix line endings, so "sha256sum -c SHA256SUMS.txt" works on Linux and WSL too
          [IO.File]::WriteAllText("$PWD/release/SHA256SUMS.txt", ($lines -join "`n") + "`n", [Text.Encoding]::ASCII)

          Get-Content release/SHA256SUMS.txt

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$env:TAG" (Get-ChildItem release -File).FullName --clobber

  # The Microsoft Store package, to upload in Partner Center. Off until the repository variable
  # STORE_IDENTITY_NAME is set; see COMPILING.md. It runs separately, so a problem with it never holds up
  # the downloads.
  store:
    if: vars.STORE_IDENTITY_NAME != ''
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ env.TAG }}

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build the Store package
        shell: pwsh
        env:
          STORE_IDENTITY_NAME: ${{ vars.STORE_IDENTITY_NAME }}
          STORE_PUBLISHER: ${{ vars.STORE_PUBLISHER }}
          STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.STORE_PUBLISHER_DISPLAY_NAME }}
        run: |
          tools/Build-StorePackage.ps1 -Version $env:TAG `
            -IdentityName $env:STORE_IDENTITY_NAME `
            -Publisher $env:STORE_PUBLISHER `
            -PublisherDisplayName $env:STORE_PUBLISHER_DISPLAY_NAME

      # Not attached to the release: the Store signs the package, so it can't be installed from here
      - uses: actions/upload-artifact@v4
        with:
          name: microsoft-store-${{ env.TAG }}
          path: store-package/*.msixupload
          if-no-files-found: error
          compression-level: 0

  # point the website at the latest published release, now its files are uploaded
  website:
    needs: release
    uses: ./.github/workflows/website-version.yml
    permissions:
      contents: write
      pages: write
